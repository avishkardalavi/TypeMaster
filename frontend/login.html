<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <link
        rel="icon"
        type="image/png"
        href="assets/typemaster-logo.png"
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - TypeMaster</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar auth-navbar">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html"
        >

            <i class="bi bi-keyboard-fill"></i>

            TypeMaster

        </a>


        <a
            href="register.html"
            class="btn btn-primary"
        >

            Create Account

        </a>

    </div>

</nav>



<!-- =========================================
     LOGIN
========================================= -->

<main class="auth-page">

    <div class="auth-card">


        <!-- ICON -->

        <div class="auth-icon">

            <i class="bi bi-box-arrow-in-right"></i>

        </div>


        <h1>Welcome back</h1>

        <p class="auth-subtitle">

            Login to continue your typing journey.

        </p>


        <!-- MESSAGE -->

        <div
            id="messageBox"
            class="alert d-none"
            role="alert"
        ></div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary auth-submit"
                id="loginBtn"
            >

                <span id="loginBtnText">

                    Login

                </span>

                <span
                    id="loginSpinner"
                    class="spinner-border spinner-border-sm d-none"
                ></span>

            </button>


        </form>


        <div class="auth-divider">

            <span>Don't have an account?</span>

        </div>


        <a
            href="register.html"
            class="login-link"
        >

            Create a TypeMaster account

        </a>


    </div>

</main>



<footer class="auth-footer">

    <p>

        © 2026 TypeMaster. All rights reserved.

    </p>

</footer>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
