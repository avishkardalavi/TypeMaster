<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <link
        rel="icon"
        type="image/png"
        href="assets/typemaster-logo.png"
    >
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - TypeMaster</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>


<!-- =========================================
     NAVBAR
========================================= -->

<nav class="navbar navbar-expand-lg auth-navbar">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html"
        >

            <i class="bi bi-keyboard-fill"></i>

            TypeMaster

        </a>


        <a
            href="login.html"
            class="btn btn-outline-primary"
        >

            Login

        </a>

    </div>

</nav>



<!-- =========================================
     REGISTER
========================================= -->

<main class="auth-page">

    <div class="auth-card">


        <!-- ICON -->

        <div class="auth-icon">

            <i class="bi bi-person-plus-fill"></i>

        </div>


        <h1>Create your account</h1>

        <p class="auth-subtitle">

            Join TypeMaster and track your typing progress.

        </p>


        <!-- ERROR / SUCCESS -->

        <div
            id="messageBox"
            class="alert d-none"
            role="alert"
        ></div>


        <!-- FORM -->

        <form id="registerForm">


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">

                    Username

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-person"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">

                    Confirm Password

                </label>

                <div class="input-wrapper">

                    <i class="bi bi-shield-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="confirmPasswordToggle"
                    >

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                class="btn btn-primary auth-submit"
                id="registerBtn"
            >

                <span id="registerBtnText">

                    Create Account

                </span>

                <span
                    id="registerSpinner"
                    class="spinner-border spinner-border-sm d-none"
                ></span>

            </button>


        </form>


        <div class="auth-divider">

            <span>Already have an account?</span>

        </div>


        <a
            href="login.html"
            class="login-link"
        >

            Login to TypeMaster

        </a>


    </div>

</main>



<footer class="auth-footer">

    <p>

        © 2026 TypeMaster. All rights reserved.

    </p>

</footer>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
